<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        width: 320px;
        height: 180px;
        margin: 0;
        overflow: hidden;
        background: transparent;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        background: transparent;
      }
      #card {
        position: absolute;
        inset: 40px 80px;
        border-radius: 16px;
        background: rgba(255, 64, 96, 0.65);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="1"
      data-width="320"
      data-height="180"
    >
      <div id="card"></div>
    </div>
  </body>
</html>
